id: FEAT-0012
title: 発注資料ダウンロードの命名規則変更
status: approved
created_at: "2026-02-24"
priority: medium

summary: |
  メーカー向け発注資料ZIPのフォルダ・ファイル命名規則を刷新する。
  現状はメーカー名を含む命名だが、新仕様では商品種類＋日付を基軸とした
  統一フォーマットに変更する。

background: |
  現状の命名規則はメーカー名ベースで管理しづらい。
  外部メーカーに送付する発注資料として、商品種類・サイズ・カラー・数量が
  ファイル名から一目でわかる命名規則に統一する。

scope:
  in:
    - ZIP ファイル名の変更
    - タイプフォルダ名の変更（メーカー名除去）
    - 発注リストCSVファイル名の変更
    - イメージ画像ファイル名の変更
    - 製造データ①ファイル名の変更（商品フルネーム＋数量＋MMDD形式）
    - 製造データ②（アクリルフィギュアスタンド）の追加
    - 注文別サブフォルダの廃止（タイプフォルダ直下にフラット配置）
  out:
    - 発注リストのフォーマット変更（CSVのまま、XLSXへの変換なし）
    - フロントエンドUI変更
    - 既存データのマイグレーション

naming_rules:
  overview: |
    ダウンロードされるZIPは「タイプフォルダ名.zip」。
    ZIP内はタイプフォルダ直下に全ファイルをフラット配置（注文別サブフォルダなし）。

  zip_name:
    format: "{type_folder_name}.zip"
    note: "タイプフォルダ名と完全一致"

  type_folder_name:
    default: "{商品種類カテゴリ}_{YYYYMMDD}"
    examples:
      - "アクリルキーホルダー_20260224"
      - "アクリルフィギュア_20260224"
      - "ステッカー_20260224"
      - "トートバッグ_20260224"
    tshirt_special:
      format: "Tシャツ- {印刷位置} -_{YYYYMMDD}"
      note: "Tシャツのみ印刷位置（position フィールド）ごとにフォルダを分割"
      examples:
        - "Tシャツ- 正面 -_20260224"
        - "Tシャツ- 背面 -_20260224"

  order_list_csv:
    format: "{フォルダ名prefix}発注リスト_{YYYYMMDD}.csv"
    note: "フォルダ名から '_YYYYMMDD' を除いたprefixに「発注リスト_YYYYMMDD.csv」を付加"
    examples:
      - "アクリルキーホルダー発注リスト_20260224.csv"
      - "アクリルフィギュア発注リスト_20260224.csv"
      - "ステッカー発注リスト_20260224.csv"
      - "トートバッグ発注リスト_20260224.csv"
      - "Tシャツ- 正面 -発注リスト_20260224.csv"

  image_file:
    format: "{注文番号}_{製造番号}.png"
    note: "thumbnail_image_url からダウンロード。現状の thumbnail_{filename} から変更。"
    examples:
      - "POD-20260101-0001_abc123.png"

  manufacturing_data_1:
    format: "{商品フルネーム}【{数量}個】_{注文番号}_{製造番号}_{MMDD}.{ext}"
    note: |
      - {商品フルネーム} = 商品種類 - サイズ - カラー（product_name フィールド）
      - {数量} = quantity フィールドの値
      - {MMDD} = ダウンロード時刻の月日2桁ずつ
      - 拡張子は商品種類によって異なる
    extensions_by_product:
      Tシャツ: "_front.pdf （_front サフィックスを付加）"
      トートバッグ: ".pdf"
      アクリルキーホルダー: ".ai"
      アクリルフィギュア: ".ai"
      ステッカー: ".ai"
    examples:
      - "Tシャツ - M - 正面 - 白【1個】_POD-20260101-0001_abc123_0224_front.pdf"
      - "アクリルキーホルダー - 50x50 (mm) - アクリル【2個】_POD-20260101-0002_def456_0224.ai"
      - "アクリルフィギュア - 70x70mm - アクリル【1個】_POD-20260101-0003_ghi789_0224.ai"
      - "ステッカー - 100x100mm - ホワイト【3個】_POD-20260101-0004_jkl012_0224.ai"
      - "トートバッグ - M - ナチュラル【1個】_POD-20260101-0005_mno345_0224.pdf"

  manufacturing_data_2:
    target: "アクリルフィギュアのみ"
    format: "{商品フルネーム}【{数量}個】_{注文番号}_{製造番号}_{MMDD}_stand.ai"
    source: "静的サンプルファイル（DB/設定から取得）"
    current_sample: "【サンプル】アクリルフィギュアスタンド_70mm_台座.ai"
    extensibility: |
      現時点では全サイズで同一のサンプルファイルを使用するが、
      将来的にサイズ（50x50mm, 70x70mm, 100x100mm, 160x160mm 等）ごとに
      異なるAIファイルを指定できるよう、設定ベースの拡張性を持たせること。
      例：DBテーブル or YAML設定で size → stand_file_path のマッピングを管理。
    examples:
      - "アクリルフィギュア - 70x70mm - アクリル【1個】_POD-20260101-0003_ghi789_0224_stand.ai"

current_implementation:
  file: "api/app/services/manufacturer_order_service.py"
  zip_name: "{manufacturer.name}_{date}.zip"
  type_folder: "{manufacturer}/{product_type_name}_{YYYYMMDD}"
  csv_name: "{product_type_name}-発注リスト_{YYYYMMDD}.csv"
  design_file_ai: "{order_number}_{uid}_{product_type_name}.ai"
  thumbnail: "thumbnail_{original_filename}"
  sub_folder: "{type_folder}/{order_number}/"

changes_required:
  - "ZipBuilder.create_directory_name() の見直し or 廃止"
  - "generate_order_documents() のフォルダ生成ロジック変更"
  - "Tシャツは position フィールドでタイプフォルダをさらに分割"
  - "CSV ファイル名のフォーマット変更"
  - "イメージ画像のファイル名を {order_number}_{uid}.png に変更"
  - "製造データのファイル名を新フォーマットに変更（商品フルネーム・数量・MMDD含む）"
  - "アクリルフィギュアのスタンドファイル追加ロジック実装"
  - "注文別サブフォルダを廃止（フラット配置に変更）"
  - "stand ファイルのサイズ別マッピング設定（拡張性）"

acceptance_criteria:
  - "生成されるZIPファイル名が {タイプフォルダ名}.zip 形式になっている"
  - "ZIPを展開した直下が {タイプフォルダ名}/ フォルダである"
  - "タイプフォルダ内に注文別サブフォルダが存在しない（フラット配置）"
  - "発注リストCSVのファイル名が {prefix}発注リスト_{YYYYMMDD}.csv 形式になっている"
  - "イメージ画像が {注文番号}_{製造番号}.png で保存されている"
  - "製造データ①が {商品フルネーム}【{N}個】_{注文番号}_{製造番号}_{MMDD}.{ext} 形式になっている"
  - "Tシャツの製造データ①に _front.pdf が使われている"
  - "トートバッグの製造データ①が .pdf になっている"
  - "アクリルフィギュアに製造データ②（_stand.ai）が追加されている"
  - "Tシャツのタイプフォルダが印刷位置ごとに分かれている"
  - "既存のユニットテストおよび新規テストが全てパスする"
  - "アクリルフィギュアのスタンドファイルがサイズ別設定を持つ構造になっている"
