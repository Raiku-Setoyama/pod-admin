id: FEAT-0025
title: 配送一覧への「商品準備中」注文の表示
created_at: 2025-03-04
status: confirmed

summary: |
  配送一覧APIを拡張し、まだShipmentが作成されていない注文も「商品準備中」として表示する。
  新しいテーブルやステータスは追加せず、既存のOrderデータを活用して二重管理を回避する。

scope:
  include:
    - 配送一覧APIの拡張（未配送の注文も返す）
    - 配送一覧UIでの「商品準備中」「配送準備待ち」表示
    - 商品準備中の注文に対する受注CSVダウンロード
    - 商品準備中の注文に対する商品サムネイルダウンロード
  exclude:
    - 新テーブル・新ステータスの追加
    - Shipment作成ロジックの変更
    - 既存の配送機能の変更

design:
  approach: |
    アプローチB: 配送一覧で「未配送の注文」も表示
    - Shipmentを早期作成しない（全商品揃ってから作成）
    - 配送一覧の取得ロジックを拡張して、まだShipmentがないOrderも表示
    - 「商品準備中」はOrderの状態から導出（OrderItemが全てDELIVEREDでない状態）

  display_logic:
    - condition: "Order（Shipmentなし）+ 全OrderItemがDELIVEREDでない"
      status: "preparing"
      label: "商品準備中"
      badge_color: "orange"
    - condition: "Order（Shipmentなし）+ 全OrderItemがDELIVERED"
      status: "awaiting_shipment"
      label: "配送準備待ち"
      badge_color: "yellow"
    - condition: "Shipment(PENDING)"
      status: "pending"
      label: "配送準備中"
      badge_color: "gray"
    - condition: "Shipment(READY)"
      status: "ready"
      label: "配送準備完了"
      badge_color: "cyan"
    - condition: "Shipment(SHIPPED)"
      status: "shipped"
      label: "発送完了"
      badge_color: "emerald"

api:
  endpoint: "GET /shipments"
  changes:
    - description: "レスポンスに未配送の注文（PendingOrder）を含める"
    - description: "typeフィールドで shipment と pending_order を識別"

  response_schema:
    PendingOrder:
      type: string  # "pending_order"
      order_id: string
      order_number: string
      customer_name: string
      customer_address: string
      item_count: integer  # OrderItem数
      items_delivered: integer  # DELIVERED状態のOrderItem数
      status: string  # "preparing" | "awaiting_shipment"
      created_at: datetime
      order_items: OrderItemSummary[]

acceptance_criteria:
  - scenario: "商品準備中の注文が配送一覧に表示される"
    given: "注文が作成され、一部の商品がまだ製造中"
    when: "配送一覧を表示する"
    then: "「商品準備中」ステータスで表示される"

  - scenario: "全商品が揃った注文が「配送準備待ち」で表示される"
    given: "注文の全OrderItemがDELIVERED状態、かつまだShipmentが作成されていない"
    when: "配送一覧を表示する"
    then: "「配送準備待ち」ステータスで表示される"

  - scenario: "商品準備中の注文から受注CSVをダウンロードできる"
    given: "商品準備中の注文が選択されている"
    when: "受注CSVダウンロードを実行する"
    then: "既存フォーマットのCSVがダウンロードされる"

  - scenario: "商品準備中の注文からサムネイルをダウンロードできる"
    given: "商品準備中の注文が選択されている"
    when: "サムネイルダウンロードを実行する"
    then: "商品サムネイル画像のZIPがダウンロードされる"

  - scenario: "Shipment作成後は通常の配送として表示される"
    given: "「配送準備待ち」の注文からShipmentを作成した"
    when: "配送一覧を表示する"
    then: "通常の配送（PENDING）として表示され、仮想表示は消える"

constraints:
  - "既存のShipment/Order スキーマは変更しない"
  - "パフォーマンス: 配送一覧の取得速度を維持（適切なインデックス活用）"
  - "後方互換性: 既存のAPIレスポンス形式を壊さない（typeフィールドで識別）"

assumptions:
  - "商品準備中の注文は、配送（Shipment）の一括操作（ステータス更新等）の対象外"
  - "商品準備中の注文を選択してShipmentを作成する機能は、今回のスコープ外（既存の配送作成フローを使用）"
  - "フィルタ・ソートは既存の配送フィルタに準じる"
