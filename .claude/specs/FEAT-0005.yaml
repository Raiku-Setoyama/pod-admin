id: FEAT-0005
summary: 管理者サイドバーにログインユーザーのメールアドレスが表示される

background:
  why: 現在ハードコードされた固定のメールアドレス（raiku6019@gmail.com）が表示されており、実際にログインしているユーザーの情報と一致しない。複数の管理者ユーザーが存在する場合に誰がログインしているか識別できない。
  who: 管理者ユーザー（admin/staff）
  when: ダッシュボード（/orders, /shipments等）のサイドバーを表示する時

scope:
  includes:
    - サイドバーコンポーネントでログインユーザー情報を取得する機能
    - 取得したメールアドレスをサイドバーに表示する機能
    - ユーザー情報取得用のカスタムフック作成
  excludes:
    - メーカーポータルのサイドバー（すでにmanufacturerNameを動的に表示している）
    - ユーザー情報の編集機能
    - ユーザー一覧表示機能
  prerequisites:
    - バックエンド GET /api/v1/auth/me エンドポイントが存在すること（確認済み）
    - ログイン済みでaccess_tokenがlocalStorageに存在すること

input_output:
  inputs:
    - name: access_token
      type: string
      required: true
      validation: localStorageから取得、JWT形式
  outputs:
    - name: user_email
      type: string
      description: サイドバーのフッター部分に表示されるログインユーザーのメールアドレス
  state_changes:
    - なし（読み取り専用）

acceptance_criteria:
  - id: AC-001
    description: サイドバーにログインユーザーのメールアドレスが表示される
    test_type: unit
    given: ユーザーがログイン済みの状態
    when: サイドバーコンポーネントがレンダリングされる
    then: ハードコードされた値ではなく、/auth/meから取得したメールアドレスが表示される

  - id: AC-002
    description: useCurrentUserフックがユーザー情報を正しく取得する
    test_type: unit
    given: 有効なaccess_tokenがlocalStorageに存在する
    when: useCurrentUserフックが呼び出される
    then: APIからユーザー情報（email, name, role）を取得し返却する

  - id: AC-003
    description: API呼び出し中はローディング状態となる
    test_type: unit
    given: ユーザー情報取得APIが呼び出される
    when: レスポンスを待っている間
    then: isLoading=trueとなり、適切なローディング表示がされる

  - id: AC-004
    description: API呼び出しエラー時はエラー状態となる
    test_type: unit
    given: 無効なトークンまたはAPI障害
    when: useCurrentUserフックがエラーを受け取る
    then: isError=trueとなり、フォールバック表示（空文字またはログイン促し）がされる

  - id: AC-005
    description: メールアドレスが長い場合も適切に表示される
    test_type: unit
    given: 長いメールアドレス（例: very.long.email.address@subdomain.example.com）
    when: サイドバーに表示される
    then: truncateクラスにより省略表示される（既存のbase-sidebarの仕様に準拠）

constraints:
  performance:
    - ユーザー情報の取得は初回レンダリング時のみ行う（不要な再取得を避ける）
    - SWRまたはReact Queryを使用してキャッシュを活用する
  security:
    - トークンが無効な場合は適切にエラーハンドリングする
    - 認証エラー時はログインページへリダイレクトしない（サイドバー表示のみ失敗させる）
  compatibility:
    - 既存のSidebarコンポーネントの見た目を変更しない
    - BaseSidebarコンポーネントのuserInfo propsを活用する

assumptions:
  - プロジェクトではSWRまたは同様のデータフェッチライブラリが使用されていると想定
  - メールアドレスの表示形式は既存のスタイル（text-xs text-muted-foreground truncate）を踏襲
  - ユーザー情報取得エラー時は空文字を表示し、ログインページへのリダイレクトは行わない

success_metrics:
  - 管理者がサイドバーを見たとき、自分のメールアドレスが表示されている
  - 異なる管理者でログインし直すと、表示されるメールアドレスも変わる
