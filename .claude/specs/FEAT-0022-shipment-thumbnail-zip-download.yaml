id: FEAT-0022
summary: 管理者が配送一覧ページで選択した配送に紐づく商品サムネイル画像をZIPファイルとしてまとめてダウンロードできる

background:
  why: |
    配送一覧ページでは既に受注CSVエクスポート機能があるが、
    商品サムネイル画像（thumbnail_image_url）を一括でダウンロードする手段がない。
    製造確認や出荷準備の際に、選択した配送に含まれる商品のサムネイル画像を
    まとめてZIPダウンロードできることで、作業効率が向上する。
  who: 管理者（admin）
  when: |
    - 配送一覧画面（/shipments）で対象の配送を選択し、商品サムネイル画像をまとめてダウンロードしたいとき
    - 出荷準備や製造確認で、配送に紐づく商品画像を一括取得したいとき

scope:
  includes:
    - 配送一覧ページ（/shipments）の actions 内に「商品サムネイル」ZIPダウンロードボタンを追加
    - POST /shipments/download-thumbnails エンドポイントを新規追加
    - ShipmentThumbnailDownloadRequest スキーマを追加
    - ShipmentService に download_thumbnails メソッドを追加
    - 選択された配送ID → ShipmentItem → Order → OrderItem.thumbnail_image_url を収集
    - 画像URLから画像を非同期で取得（httpx）し、ZipBuilder でZIP化
    - thumbnail_image_url が null の OrderItem はスキップ
    - 全 thumbnail が null またはすべて取得失敗の場合は 404 エラー
    - ユニットテスト + 統合テスト
  excludes:
    - design_image_url のダウンロード（thumbnail_image_url のみ対象）
    - 画像のリサイズ・変換処理（元画像をそのままZIPに格納）
    - 配送詳細ページからの個別ダウンロード（既にFEAT-0021で実装済み）
    - E2Eテスト（明示的な依頼なし）
  prerequisites:
    - OrderItem モデルに thumbnail_image_url フィールドが存在すること
    - 配送一覧画面にチェックボックスによる複数選択機能（selectedIds）が存在すること
    - ZipBuilder ユーティリティ（api/app/utils/zip_builder.py）が存在すること
    - OrderImageService（api/app/services/order_image_service.py）の画像取得パターンを参考にできること

input_output:
  inputs:
    - name: shipment_ids
      type: list[string]
      required: true
      validation: 1件以上のUUID文字列リスト（Pydantic Field min_length=1）
  outputs:
    - name: ZIPファイル
      type: application/zip (StreamingResponse)
      description: |
        選択された配送のOrderItemに紐づくthumbnail_image_urlから取得した画像ファイルを格納したZIPファイル。
        ファイル名: 「配送サムネイル_{YYYYMMDD_HHMMSS}.zip」
        ZIP内のファイル構成: {order_number}/{product_name}_{index}{ext}
  state_changes:
    - なし（読み取り専用の操作）

acceptance_criteria:
  # バックエンド - スキーマ
  - id: AC-001
    description: ShipmentThumbnailDownloadRequest スキーマが shipment_ids フィールドを持ち、min_length=1 のバリデーションがある
    test_type: unit
    given: ShipmentThumbnailDownloadRequest スキーマが定義されている
    when: shipment_ids を指定してインスタンスを生成する
    then: shipment_ids フィールドが正しく設定される（list[str]、1件以上必須）

  - id: AC-002
    description: shipment_ids が空リストの場合は 422 バリデーションエラーになる
    test_type: unit
    given: 空の shipment_ids リストを使用する
    when: ShipmentThumbnailDownloadRequest のインスタンスを生成する
    then: ValidationError が発生する

  # バックエンド - サービスロジック
  - id: AC-003
    description: 選択された配送IDに紐づく OrderItem の thumbnail_image_url を収集してZIPを返す
    test_type: unit
    given: thumbnail_image_url を持つ OrderItem が紐づく配送が存在する
    when: download_thumbnails メソッドを呼び出す
    then: 対象画像を含むZIPファイルのバイトデータとファイル名のタプルが返される

  - id: AC-004
    description: thumbnail_image_url が null の OrderItem はスキップされる
    test_type: unit
    given: thumbnail_image_url が null の OrderItem が含まれる配送を選択する
    when: download_thumbnails メソッドを呼び出す
    then: null のアイテムはスキップされ、画像を持つアイテムのみがZIPに含まれる

  - id: AC-005
    description: 画像URLからの取得に失敗した場合はスキップしてログに記録する
    test_type: unit
    given: 無効な画像URL（404やタイムアウト）を持つ OrderItem が含まれる配送を選択する
    when: download_thumbnails メソッドを呼び出す
    then: 取得失敗した画像はスキップされ、ログに警告が記録され、取得できた画像のみがZIPに含まれる

  - id: AC-006
    description: 全ての thumbnail_image_url が null または全ての画像取得に失敗した場合は 404 エラーを返す
    test_type: unit
    given: 選択された配送の全 OrderItem に有効な thumbnail_image_url が存在しない
    when: download_thumbnails メソッドを呼び出す
    then: HTTPException(status_code=404, detail="ダウンロード対象のサムネイル画像がありません") が発生する

  - id: AC-007
    description: 存在しない配送IDが含まれている場合、存在する配送のみ処理される
    test_type: unit
    given: 存在しない配送IDが1件含まれる shipment_ids リストを送信する
    when: download_thumbnails メソッドを呼び出す
    then: 存在する配送に紐づく画像のみがZIPに含まれ、存在しない配送はスキップされる

  - id: AC-008
    description: ZIP内のファイルパスが「{order_number}/{product_name}_{index}{ext}」形式になっている
    test_type: unit
    given: 注文番号「ORD-001」、商品名「Tシャツ Mサイズ 白」のOrderItemがある配送を選択する
    when: download_thumbnails メソッドを呼び出す
    then: ZIP内のファイルパスが「ORD-001/Tシャツ Mサイズ 白_1.png」のような形式になっている

  - id: AC-009
    description: ZIPファイル名が「配送サムネイル_{YYYYMMDD_HHMMSS}.zip」形式である
    test_type: unit
    given: download_thumbnails メソッドを呼び出す
    when: 戻り値のファイル名を確認する
    then: ファイル名が「配送サムネイル_YYYYMMDD_HHMMSS.zip」のパターンに一致する

  # バックエンド - APIエンドポイント
  - id: AC-010
    description: POST /shipments/download-thumbnails が ZIPファイルをレスポンスとして返す
    test_type: integration
    given: thumbnail_image_url を持つ OrderItem が紐づく配送が存在する
    when: POST /api/v1/shipments/download-thumbnails に shipment_ids を送信する
    then: Content-Type が application/zip、Content-Disposition に適切なファイル名が設定されたレスポンスが返される

  - id: AC-011
    description: 管理者認証が必要
    test_type: integration
    given: 認証されていないユーザー
    when: POST /api/v1/shipments/download-thumbnails を呼び出す
    then: 401 Unauthorized エラーが返される

  # フロントエンド - ボタン表示
  - id: AC-012
    description: 「商品サムネイル」ボタンが受注CSVボタンの右横に表示される
    test_type: unit
    given: 配送一覧ページを開いている
    when: ページを表示する
    then: 「商品サムネイル」ボタンが受注CSVボタンの右横に存在する

  - id: AC-013
    description: selectedIds が空の場合、「商品サムネイル」ボタンが disabled になる
    test_type: unit
    given: 配送一覧ページを開いている
    when: 配送を1件も選択していない
    then: 「商品サムネイル」ボタンが disabled 状態である

  - id: AC-014
    description: selectedIds が1件以上の場合、「商品サムネイル」ボタンが有効になる
    test_type: unit
    given: 配送一覧ページを開いている
    when: 1件以上の配送にチェックを入れる
    then: 「商品サムネイル」ボタンが有効状態である

  - id: AC-015
    description: ボタンクリック時に POST /shipments/download-thumbnails を呼び出しZIPがダウンロードされる
    test_type: unit
    given: 配送一覧ページで1件以上の配送を選択している
    when: 「商品サムネイル」ボタンをクリックする
    then: ZIPファイルのダウンロードが開始される

  - id: AC-016
    description: ダウンロード中はボタンが disabled になり「ダウンロード中...」と表示される
    test_type: unit
    given: 「商品サムネイル」ボタンをクリックした直後
    when: ダウンロード処理が進行中
    then: ボタンが disabled で「ダウンロード中...」のテキストが表示される

  - id: AC-017
    description: ダウンロード成功時に toast.success が表示される
    test_type: unit
    given: ダウンロード処理が正常に完了した
    when: レスポンスを受信する
    then: toast.success で成功メッセージが表示される

  - id: AC-018
    description: ダウンロード失敗時に toast.error が表示される
    test_type: unit
    given: ダウンロード処理が失敗した（サーバーエラー等）
    when: エラーレスポンスを受信する
    then: toast.error でエラーメッセージが表示される

constraints:
  performance:
    - 画像取得は並列で行い、1画像あたりのタイムアウトは10秒
    - 同時取得数は最大10並列（asyncio.Semaphore(10)）
    - OrderImageService と同様の並列取得パターンを使用する
  security:
    - 管理者（admin）のみアクセス可能（get_current_admin 依存関係を使用）
    - 画像URLは OrderItem の thumbnail_image_url フィールドに保存されたもののみ取得（任意URLの指定不可）
  compatibility:
    - 既存の配送一覧画面のUI・機能を壊さない
    - 既存の受注CSVエクスポート・ステータス更新・伝票番号インポート機能と共存する

assumptions:
  - thumbnail_image_url は外部URL（HTTPS）であり、認証なしでアクセス可能と想定
  - 画像の拡張子はURLのパスから推定する。推定できない場合はContent-Typeヘッダーから判定し、それでも不明な場合は .png とする
  - 同一注文番号内で同名ファイルが発生する場合は連番で区別する（_1, _2, ...）
  - ZIPファイルのサイズ上限は特に設けない（実運用上、数十件程度の配送を想定）
  - フロントエンドのダウンロード処理は handleExportCsv と同じパターン（fetch + blob + Content-Disposition）で実装
  - ボタンの UI は既存の受注CSVボタンと同様（variant="outline"、Download アイコン）
  - ShipmentService に直接 download_thumbnails メソッドを追加する（別サービスは作成しない）
  - ShipmentService が既に依存している ShipmentRepository 経由で Shipment → ShipmentItem → Order → OrderItem を辿れる

success_metrics:
  - 配送一覧画面から選択した配送の商品サムネイル画像をZIPで一括ダウンロードできる
  - 画像がない OrderItem や取得失敗したURLがあっても、エラーにならず取得できた画像のみがダウンロードされる
  - 既存の配送一覧・CSVエクスポート・ステータス更新・伝票番号インポート機能に影響がない
  - 全テスト（ユニット・統合）がパスする
