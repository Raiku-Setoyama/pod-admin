id: FEAT-0010
summary: 発注ページで複数の受注をチェックボックスで選択し、発注ステータスを一括更新できる

background:
  why: |
    配送ページでは複数の配送を選択して一括でステータス更新ができるが、
    発注ページ（受注一覧）には同様の機能がない。
    管理者が大量の受注を効率的に処理するため、発注ページでも一括ステータス更新機能が必要。
  who: 管理者（全ユーザー）
  when: 複数の受注を同時に「発注中→製造中」や「製造中→納入済」などに変更したい場合

scope:
  includes:
    - フロントエンド: 受注一覧テーブルにチェックボックス列を追加
    - フロントエンド: 全選択/個別選択のチェックボックス動作
    - フロントエンド: 選択件数表示とステータス一括更新ボタン
    - フロントエンド: ステータス選択ダイアログ（配送ページと同様のUI）
    - バックエンド: 発注ステータス一括更新APIエンドポイント（PATCH /orders/bulk-status）
    - バックエンド: 一括更新時のステータス遷移バリデーション（既存ルールの適用）
    - バックエンド: 一括更新結果のレスポンス（成功件数・失敗件数・失敗ID）
  excludes:
    - CSVエクスポート機能（発注ページには配送CSVエクスポートのような機能は追加しない）
    - ステータス変更履歴の記録（別機能として要検討）
  prerequisites:
    - 既存の単一受注ステータス更新API（PATCH /orders/{order_id}/status）が動作すること
    - OrderServiceのupdate_statusメソッドが正しくステータス遷移を検証していること

input_output:
  inputs:
    - name: order_ids
      type: list[string]
      required: true
      validation: 1件以上のUUID配列
    - name: status
      type: OrderStatus
      required: true
      validation: "ordered" | "manufacturing" | "delivered" のいずれか（"shipped"は不可）
  outputs:
    - name: updated_count
      type: integer
      description: 正常に更新された件数
    - name: failed_count
      type: integer
      description: 更新に失敗した件数（ステータス遷移不可など）
    - name: failed_ids
      type: list[string]
      description: 更新に失敗した受注IDのリスト
  state_changes:
    - 指定された受注のステータスが新しいステータスに更新される
    - delivered に変更された受注には配送レコード（Shipment）が自動作成される
    - ordered/manufacturing に戻された受注の関連Shipment（shippedでないもの）は削除される

acceptance_criteria:
  - id: AC-001
    description: 受注一覧テーブルにチェックボックス列が表示される
    test_type: unit
    given: 受注一覧ページを表示
    when: ページが読み込まれる
    then: 各行にチェックボックスが表示され、ヘッダーに全選択チェックボックスが表示される

  - id: AC-002
    description: 全選択チェックボックスで全ての行を選択/解除できる
    test_type: unit
    given: 受注一覧に複数の受注がある
    when: ヘッダーの全選択チェックボックスをクリック
    then: 全ての行のチェックボックスが選択状態になり、再度クリックで全て解除される

  - id: AC-003
    description: 個別選択でチェックボックスを操作できる
    test_type: unit
    given: 受注一覧に複数の受注がある
    when: 特定の行のチェックボックスをクリック
    then: その行のみが選択状態になる

  - id: AC-004
    description: 選択中の件数が表示される
    test_type: unit
    given: 受注一覧で複数の受注を選択
    when: 選択件数が変わる
    then: 「選択した{N}件を更新」ボタンに件数が反映される

  - id: AC-005
    description: 選択がある場合のみ一括更新ボタンが表示される
    test_type: unit
    given: 受注一覧ページを表示
    when: 1件以上選択されている
    then: 「選択した{N}件を更新」ボタンが表示される

  - id: AC-006
    description: 一括更新ダイアログでステータスを選択できる
    test_type: unit
    given: 1件以上の受注を選択
    when: 「選択した{N}件を更新」ボタンをクリック
    then: ステータス選択ダイアログが表示され、発注中・製造中・納入済を選択できる

  - id: AC-007
    description: 一括更新APIが正常に動作する
    test_type: integration
    given: 複数の受注が「発注中」ステータスで存在する
    when: PATCH /orders/bulk-status で status="manufacturing" を送信
    then: 全ての受注のステータスが「製造中」に更新され、updated_count が正しい件数を返す

  - id: AC-008
    description: 一括更新で一部のみ成功する場合、結果が正しく返る
    test_type: integration
    given: 「発注中」と「shipped」の受注が混在している
    when: PATCH /orders/bulk-status で全てを「製造中」に変更しようとする
    then: 「発注中」の受注のみ更新され、「shipped」の受注は失敗としてfailed_idsに含まれる

  - id: AC-009
    description: shipped への直接遷移は拒否される
    test_type: integration
    given: 複数の受注が「発注中」ステータスで存在する
    when: PATCH /orders/bulk-status で status="shipped" を送信
    then: 422エラーが返り、全ての受注が更新されない

  - id: AC-010
    description: delivered への変更時にShipmentが自動作成される
    test_type: integration
    given: 複数の受注が「製造中」ステータスで存在し、Shipmentがない
    when: PATCH /orders/bulk-status で status="delivered" を送信
    then: 全ての受注のステータスが「納入済」に更新され、各受注にShipmentが作成される

  - id: AC-011
    description: delivered から ordered への戻し時にShipmentが削除される
    test_type: integration
    given: 複数の受注が「納入済」ステータスで、pending状態のShipmentがある
    when: PATCH /orders/bulk-status で status="ordered" を送信
    then: 全ての受注のステータスが「発注中」に更新され、関連Shipmentが削除される

  - id: AC-012
    description: shipped状態のShipmentがある受注は delivered から戻せない
    test_type: integration
    given: 「納入済」の受注があり、関連Shipmentが「shipped」状態
    when: PATCH /orders/bulk-status で status="ordered" を送信
    then: その受注は更新失敗となり、failed_idsに含まれる

  - id: AC-013
    description: 空のorder_idsは400エラー
    test_type: unit
    given: リクエストボディにorder_ids=[]を指定
    when: PATCH /orders/bulk-status を送信
    then: 400エラーが返る

  - id: AC-014
    description: 一括更新成功時にトースト通知が表示される
    test_type: unit
    given: 複数の受注を選択して一括更新を実行
    when: 更新が成功する
    then: 「{N}件のステータスを更新しました」のトースト通知が表示される

  - id: AC-015
    description: 一部失敗時に警告トーストも表示される
    test_type: unit
    given: 複数の受注を選択して一括更新を実行
    when: 一部の更新が失敗する
    then: 成功トーストと「{N}件は更新できませんでした」の警告トーストが表示される

constraints:
  performance:
    - 100件の一括更新が5秒以内に完了すること
  security:
    - 管理者認証が必要（get_current_admin依存）
  compatibility:
    - Chrome/Safari/Firefox 最新版対応

assumptions:
  - 配送ページの一括更新UIと同様のデザイン・操作性を踏襲する
  - チェックボックスのクリックは行クリック（詳細遷移）とは独立して動作する
  - ページネーション時、現在表示中のページの受注のみが選択対象となる（ページ切り替えで選択はリセット）
  - OrderListコンポーネントを修正し、selectedIds/onSelectChangeプロパティを追加する（ShipmentListと同様）

success_metrics:
  - 一括更新機能により、管理者が複数受注のステータス変更を効率的に行える
  - 配送ページと同じ操作感で直感的に使用できる
