id: FEAT-0004
title: 発注資料ダウンロード時のステータス自動切り替え
status: confirmed
created_at: 2026-02-23

summary: |
  メーカーが発注資料をダウンロードした際、ダウンロードに含まれた受注明細の
  ステータスを「発注中」から「製造中」へ自動的に切り替える。

scope:
  include:
    - 発注資料ダウンロードAPI（GET /manufacturers/{manufacturer_id}/order-documents）の変更
    - ダウンロード対象を「発注中」ステータスのみに制限
    - ダウンロード成功時のステータス自動更新
  exclude:
    - フロントエンドUIの変更（既存のダウンロードボタンはそのまま）
    - ステータス手動更新機能の変更

acceptance_criteria:
  - scenario: 発注資料ダウンロード時にステータスが自動更新される
    given: メーカーAに「発注中」ステータスの受注明細が3件ある
    when: 管理者がその3件を選択して発注資料をダウンロードする
    then:
      - ZIPファイルが正常にダウンロードされる
      - 3件の受注明細のステータスが「製造中」に更新される

  - scenario: 発注中以外のステータスはダウンロード対象外
    given: メーカーAに「発注中」2件、「製造中」1件の受注明細がある
    when: 管理者が3件すべてを指定してダウンロードを実行する
    then:
      - 「発注中」の2件のみがZIPに含まれる
      - 「発注中」の2件のステータスが「製造中」に更新される
      - 「製造中」の1件はステータス変更されない

  - scenario: 発注中の明細が0件の場合
    given: メーカーAに「製造中」の受注明細のみがある
    when: 管理者がそれらを指定してダウンロードを実行する
    then:
      - 400エラー「ダウンロード対象の発注中明細がありません」が返る

constraints:
  - ダウンロードとステータス更新はトランザクションで行う
  - ZIP生成が成功した場合のみステータスを更新する

assumptions:
  - フロントエンドは既存のダウンロードボタンをそのまま使用
  - ステータス更新の通知やログは既存の仕組みに従う
