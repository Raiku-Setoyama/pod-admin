id: FEAT-0024
summary: 発注書のシール用テキスト情報を命名ルール通りに修正する（商品名→商品種類）

background:
  why: |
    現在の実装では「シール用テキスト情報」で「商品名」を使用しているが、
    `/docs/20260220_製造データファイル名.md` の命名ルールでは「商品種類」を使用すべき。
    例: "アクリルキーホルダー - 50x50 (mm) - アクリル" のような形式。
  who: メーカー（製造業者）
  when: 発注データZIPダウンロード時、発注リストExcel生成時

scope:
  includes:
    - シール用テキスト情報の形式を「{商品種類}【個数】{個数}個_{注文番号}_{製品番号}_{MMDD}」に修正
    - order_list_generator.py の generate_order_list_csv/xlsx 関数の修正
  excludes:
    - 製造データファイル名の形式変更（product_name を使用したまま）
    - フォルダ名の変更
    - 発注リストファイル名の変更
    - イメージ画像ファイル名の変更
    - 日付形式の変更（MMDD のまま）
  prerequisites:
    - 既存の order_list_generator.py が存在
    - 既存の manufacturer_order_service.py が存在

input_output:
  inputs:
    - name: ordered_date
      type: datetime
      required: true
      validation: 有効な日時
    - name: product_detail
      type: string
      required: true
      validation: 商品種類文字列（例: "アクリルキーホルダー - 50x50 (mm) - アクリル"）
    - name: quantity
      type: integer
      required: true
      validation: 1以上の整数
    - name: order_number
      type: string
      required: true
      validation: 注文番号
    - name: uid
      type: string
      required: true
      validation: 製品番号
  outputs:
    - name: seal_text
      type: string
      description: |
        シール用テキスト情報
        形式: {商品種類}【個数】{個数}個_{注文番号}_{製品番号}_{MMDD}
        例: アクリルキーホルダー - 50x50 (mm) - アクリル【個数】3個_ORD-001_UID-123_0215
  state_changes:
    - 発注リストExcelのシール用テキスト情報列で商品種類を使用

acceptance_criteria:
  - id: AC-001
    description: シール用テキスト情報が商品種類を使用する
    test_type: unit
    given: 商品種類が「アクリルキーホルダー - 50x50 (mm) - アクリル」、個数が3、注文番号が「ORD-001」、製品番号が「UID-123」、注文日が2026年2月15日
    when: シール用テキスト情報を生成する
    then: 「アクリルキーホルダー - 50x50 (mm) - アクリル【個数】3個_ORD-001_UID-123_0215」が出力される

  - id: AC-002
    description: MMDDは月の2桁と日の2桁で構成される
    test_type: unit
    given: 注文日が2026年12月1日
    when: MMDD部分を生成する
    then: 「1201」が出力される

  - id: AC-003
    description: 1月の場合でもMMDDが正しく2桁で出力される
    test_type: unit
    given: 注文日が2027年1月5日
    when: MMDD部分を生成する
    then: 「0105」が出力される

  - id: AC-004
    description: 発注リストExcelのシール用テキスト情報が商品種類を使用する
    test_type: integration
    given: 発注データが存在する
    when: 発注リストExcelを生成する
    then: シール用テキスト情報列に商品種類が含まれる

constraints:
  performance:
    - 既存の処理速度を維持（追加の外部APIコールなし）
  security:
    - 既存の認証・認可を維持
  compatibility:
    - 既存のExcelフォーマット（6列構成）を維持
    - 既存のZIPフォルダ構造を維持
    - 日付形式はMMDDのまま維持

assumptions:
  - ドキュメントのテーブル内「MMDD」が正しい仕様
  - 商品種類（product_detail）は既存の実装で生成済み

success_metrics:
  - 生成されるシール用テキスト情報で商品種類が使用されている
  - 既存のユニットテスト・統合テストがパスする
