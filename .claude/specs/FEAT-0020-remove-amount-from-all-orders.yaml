id: FEAT-0020
summary: /purchase-orders/all ページから金額表示（サマリー合計金額・テーブル金額カラム）を削除する

background:
  why: 全メーカー横断発注明細一覧ページで金額情報を表示する必要がなくなったため、UIから金額関連の表示を除去する
  who: 管理者（発注管理画面を使用するユーザー）
  when: /purchase-orders/all ページを閲覧する際

scope:
  includes:
    - サマリーカードから「合計金額」セクション（dt/dd）を削除
    - サマリーカードのグリッドを3カラムから2カラムに変更
    - テーブルヘッダーから「金額」カラムを削除
    - テーブル行から金額セル（price * quantity の計算表示）を削除
    - テーブルの colSpan を10から9に変更（ローディング・空メッセージ行）
    - page.tsx の displayData フォールバックから total_amount プロパティを削除
    - 既存テストの金額関連アサーションを削除・修正
  excludes:
    - バックエンドAPI（AllManufacturerOrderItemListResponse）の変更（APIは既存のまま、フロントエンドで表示しないだけ）
    - TypeScript型定義（api/index.ts）の変更（APIレスポンス型はそのまま維持）
    - 他ページ（メーカー別発注詳細等）の金額表示には影響しない
    - 請求書（invoice）関連の金額処理には影響しない
  prerequisites:
    - /purchase-orders/all ページが既に実装済み（FEAT-0018）
    - AllManufacturerOrderList コンポーネントが存在する

input_output:
  inputs: []
  outputs:
    - name: サマリーカード
      type: UI
      description: 「明細数」「合計数量」の2項目のみ表示（「合計金額」なし）
    - name: テーブル
      type: UI
      description: メーカー名・注文番号・製品番号・商品名・商品タイプ・ステータス・数量・顧客名・受注日の9カラム（「金額」カラムなし）
  state_changes: []

acceptance_criteria:
  - id: AC-001
    description: サマリーカードに「合計金額」が表示されない
    test_type: unit
    given: AllManufacturerOrderList コンポーネントにデータが渡される
    when: コンポーネントがレンダリングされる
    then: 「合計金額」というラベルが画面上に存在しない。「明細数」「合計数量」のみ表示される

  - id: AC-002
    description: テーブルヘッダーに「金額」カラムが表示されない
    test_type: unit
    given: AllManufacturerOrderList コンポーネントにデータが渡される
    when: コンポーネントがレンダリングされる
    then: テーブルヘッダーに「金額」が存在しない。カラム数は9

  - id: AC-003
    description: テーブル行に金額セルが表示されない
    test_type: unit
    given: AllManufacturerOrderList コンポーネントに明細データが渡される
    when: コンポーネントがレンダリングされる
    then: 各行に「¥」プレフィックス付きの金額計算結果が表示されない（price * quantity の表示なし）

  - id: AC-004
    description: サマリーカードのグリッドが2カラムに変更される
    test_type: unit
    given: AllManufacturerOrderList コンポーネントがレンダリングされる
    when: サマリーカードを確認する
    then: grid-cols-2 クラスが適用されている

  - id: AC-005
    description: 既存の明細数・合計数量の表示は維持される
    test_type: unit
    given: AllManufacturerOrderList コンポーネントにデータ（total=3, total_quantity=8）が渡される
    when: コンポーネントがレンダリングされる
    then: 「3件」「8点」が正しく表示される

  - id: AC-006
    description: page.tsx の displayData フォールバックから total_amount が削除される
    test_type: unit
    given: /purchase-orders/all/page.tsx のソースコード
    when: displayData のフォールバック値を確認する
    then: total_amount プロパティが含まれていない

constraints:
  performance: []
  security: []
  compatibility: []

assumptions:
  - バックエンドAPIのレスポンスには引き続き total_amount が含まれるが、フロントエンドでは使用・表示しない
  - TypeScript型定義（AllManufacturerOrderItemListResponse）はAPIとの整合性のため変更しない
  - page.tsx の displayData フォールバックからは total_amount を削除する（表示に不要であり、型上はAPIレスポンスから取得されるため）

success_metrics:
  - /purchase-orders/all ページに金額関連の表示が一切ない
  - 既存テスト（金額以外）が全てパスする
  - 金額関連のテストが削除または修正され、テストスイート全体がパスする

affected_files:
  implementation:
    - web/src/features/purchase-orders/components/all-manufacturer-order-list.tsx
    - web/src/app/(dashboard)/purchase-orders/all/page.tsx
  tests:
    - web/tests/unit/feat-0018-all-manufacturer-orders.test.tsx
