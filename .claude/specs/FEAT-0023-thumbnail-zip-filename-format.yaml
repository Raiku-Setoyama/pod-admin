id: FEAT-0023
summary: 配送サムネイルZIPダウンロード機能のZIP内画像ファイル名を「発注番号_製造番号.拡張子」のフラット構造に変更できる

background:
  why: |
    現在のZIP内ファイル構造は「{order_number}/{product_name}_{index}{ext}」形式だが、
    運用上は「発注番号_製造番号」形式でフラットに格納した方が、
    後続の製造工程でファイルを扱いやすい。
    product_name や連番(index)ではなく、OrderItem.uid（製造番号）で一意に識別する。
  who: 管理者（配送管理担当者）
  when: 配送一覧から商品サムネイル画像をZIPダウンロードする際

scope:
  includes:
    - ShipmentService.download_thumbnails メソッドの image_tasks 構築ロジック変更
    - fetch_image の戻り値から product_name, index を除去し uid を追加
    - ZIP内ファイルパスを「{order_number}_{uid}{ext}」のフラット構造に変更
    - item_counter / index の削除
    - 既存ユニットテスト（test_shipment_thumbnail_download.py）の期待値修正
  excludes:
    - ZIPファイル名（配送サムネイル_{YYYYMMDD_HHMMSS}.zip）の変更（現行維持）
    - フロントエンド側の変更（API レスポンス形式は変わらない）
    - 他のサービス・エンドポイントへの変更
  prerequisites:
    - OrderItem モデルに uid フィールドが存在すること（確認済み: String(100), nullable=True）
    - FEAT-0022 で実装済みの download_thumbnails メソッドが存在すること

input_output:
  inputs:
    - name: shipment_ids
      type: list[str]
      required: true
      validation: 1件以上の配送ID
  outputs:
    - name: ZIP file
      type: tuple[bytes, str]
      description: |
        ZIPバイトデータとファイル名のタプル。
        ZIP内の各画像ファイルは「{order_number}_{uid}{ext}」形式のフラット構造。
        サブディレクトリなし。
  state_changes: []

acceptance_criteria:
  - id: AC-001
    description: image_tasks に uid が含まれ、product_name と index が含まれない
    test_type: unit
    given: サムネイル画像URLを持つOrderItemが存在する配送
    when: download_thumbnails を呼び出す
    then: |
      image_tasks の各エントリに "uid" キーが含まれ、
      "product_name" と "index" キーが含まれない

  - id: AC-002
    description: ZIP内ファイルパスが「{order_number}_{uid}{ext}」形式のフラット構造
    test_type: unit
    given: order_number="ORD-001", uid="MFG-001" のOrderItemが存在する配送
    when: download_thumbnails を呼び出してZIPを生成する
    then: |
      ZIP内のファイルパスが "ORD-001_MFG-001.png" のようなフラット形式になる。
      サブディレクトリ（"/"）を含まない。

  - id: AC-003
    description: uid が None の場合は空文字として扱われる
    test_type: unit
    given: uid が None の OrderItem が存在する配送
    when: download_thumbnails を呼び出す
    then: ZIP内のファイルパスが "ORD-001_.png" のように uid 部分が空文字になる

  - id: AC-004
    description: 複数アイテムがある場合、各ファイルが個別のuidで命名される
    test_type: unit
    given: 同一注文に uid="MFG-001" と uid="MFG-002" の2つのOrderItemがある配送
    when: download_thumbnails を呼び出す
    then: ZIP内に "ORD-001_MFG-001.png" と "ORD-001_MFG-002.png" の2ファイルが格納される

  - id: AC-005
    description: fetch_image の戻り値に uid が含まれ product_name と index が含まれない
    test_type: unit
    given: 画像取得が成功する場合
    when: fetch_image が実行される
    then: 戻り値の dict に "uid" キーが含まれ、"product_name" と "index" キーが含まれない

  - id: AC-006
    description: 既存の機能（サムネイルnullスキップ、取得失敗スキップ、404エラー等）が維持される
    test_type: unit
    given: 既存テスト（AC-001〜AC-007, AC-009）のシナリオ
    when: download_thumbnails を呼び出す
    then: ファイルパス形式以外の既存動作が維持される

constraints:
  performance:
    - 既存の並列取得（Semaphore=10）の動作は維持する
  security: []
  compatibility:
    - 変更は shipment_service.py とそのユニットテストのみに限定する

assumptions:
  - OrderItem.uid は製造番号を表し、同一注文内で一意であると想定する
  - uid が None の場合は空文字("")として扱い、ファイル名は「{order_number}_{ext}」形式となる
  - ZIP内のファイル名重複（同じorder_number + 同じuid）が発生した場合の特別な処理は不要と想定する（ZipBuilder側で上書きまたは追記される）

success_metrics:
  - shipment_service.py の download_thumbnails メソッドが変更後の仕様通りに動作する
  - 全ユニットテストがパスする
  - ZIP内ファイルパスがフラット構造の「{order_number}_{uid}{ext}」形式になる
