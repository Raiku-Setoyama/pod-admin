id: FEAT-0019
summary: 管理者が配送一覧画面の「伝票番号インポート」ボタンをクリックすると、既存のTrackingImportコンポーネントがモーダルダイアログで開き、CSV/XLSXファイルによる伝票番号一括インポートを実行できる

background:
  why: |
    GitHub issue #38: 配送一覧画面（web/src/app/(dashboard)/shipments/page.tsx）に
    「伝票番号インポート」ボタンが配置されているが、onClick ハンドラーが設定されておらず
    クリックしても何も起きない。バックエンドAPI（POST /api/v1/shipments/import）と
    フロントエンドのTrackingImportコンポーネント（web/src/features/shipments/components/tracking-import.tsx）
    は既にFEAT-0018で実装済みだが、page.tsxへの統合が未完了のまま残っている。
  who: 管理者（admin）
  when: |
    配送一覧画面で伝票番号をCSV/XLSXファイルから一括インポートしたい場面。
    ボタンをクリックしてモーダルを開き、ファイルを選択してインポートを実行する。

scope:
  includes:
    - "page.tsx の「伝票番号インポート」ボタンに onClick ハンドラーを追加し、モーダル開閉状態を管理する"
    - "Dialog コンポーネントでモーダルを実装し、中に既存の TrackingImport コンポーネントを配置する"
    - "インポート完了後に配送一覧を自動リフレッシュする（mutate() を呼び出す）"
    - "モーダルを閉じた際に TrackingImport の内部状態（選択ファイル・結果表示）をリセットする"
  excludes:
    - "TrackingImport コンポーネント自体の機能変更（既存のまま使用）"
    - "バックエンドAPIの変更（POST /api/v1/shipments/import は実装済み）"
    - "新規APIエンドポイントの追加"
    - "TrackingImport コンポーネントの内部ロジック修正"
  prerequisites:
    - "TrackingImport コンポーネントが web/src/features/shipments/components/tracking-import.tsx に存在する"
    - "POST /api/v1/shipments/import エンドポイントが実装済み"
    - "Dialog コンポーネントが @/components/ui/dialog に存在する（page.tsx で既に使用中）"

input_output:
  inputs:
    - name: ボタンクリック
      type: user_action
      required: true
      validation: "「伝票番号インポート」ボタンのクリックイベント"
  outputs:
    - name: モーダルダイアログ
      type: UI
      description: "TrackingImport コンポーネントを内包するモーダルダイアログが表示される"
    - name: 配送一覧の自動更新
      type: side_effect
      description: "インポート成功後、配送一覧が最新データに更新される（SWR mutate）"
  state_changes:
    - "モーダルの開閉状態（boolean）が page.tsx の state として管理される"
    - "インポート成功時に配送一覧データが再取得される"

acceptance_criteria:
  - id: AC-001
    description: 「伝票番号インポート」ボタンをクリックするとモーダルダイアログが開く
    test_type: unit
    given: 配送一覧画面が表示されている
    when: 「伝票番号インポート」ボタンをクリックする
    then: TrackingImport コンポーネントを含むモーダルダイアログが表示される

  - id: AC-002
    description: モーダル内に TrackingImport コンポーネントが正しく表示される
    test_type: unit
    given: モーダルダイアログが開いている
    when: モーダルの内容を確認する
    then: ファイル選択UI、テンプレートダウンロードリンク、インポートボタンが表示されている

  - id: AC-003
    description: モーダルの閉じるボタン（X）またはオーバーレイクリックでモーダルが閉じる
    test_type: unit
    given: モーダルダイアログが開いている
    when: モーダルの閉じるボタンをクリックする、またはオーバーレイをクリックする
    then: モーダルが閉じる

  - id: AC-004
    description: インポート成功後に配送一覧が自動リフレッシュされる
    test_type: unit
    given: モーダル内でCSVファイルをインポートし、成功した
    when: TrackingImport の onImportComplete コールバックが呼ばれる
    then: useShipments の mutate() が呼ばれ、配送一覧が最新データに更新される

  - id: AC-005
    description: モーダルを再度開いた際に前回の状態（選択ファイル・結果）がリセットされている
    test_type: unit
    given: 前回インポートを実行してモーダルを閉じた後
    when: 再度「伝票番号インポート」ボタンをクリックしてモーダルを開く
    then: ファイル選択が未選択状態、結果表示がクリアされた初期状態で表示される

  - id: AC-006
    description: モーダルのタイトルに「伝票番号インポート」と表示される
    test_type: unit
    given: モーダルダイアログが開いている
    when: モーダルヘッダーを確認する
    then: DialogTitle に「伝票番号インポート」というタイトルが表示される

constraints:
  performance:
    - "モーダルの開閉はユーザー操作に対して即座に反応すること（遅延なし）"
  security:
    - "認証済み管理者のみがアクセスできるページ内の機能であり、追加のセキュリティ制御は不要"
  compatibility:
    - "既存の Dialog コンポーネント（shadcn/ui）を使用するため、ブラウザ互換性は既存と同等"

assumptions:
  - "TrackingImport コンポーネントは Card ラッパーを含んでいるため、モーダル内では Dialog の装飾と二重にならないよう、必要に応じてスタイル調整する可能性がある（architect に委ねる）"
  - "モーダルの閉じる動作で TrackingImport の内部状態をリセットするには、key prop を利用してコンポーネントを再マウントさせる方式を想定"
  - "「伝票番号インポート」ボタンは選択件数に関わらず常に有効（disabled にしない）"
  - "モーダルのサイズは TrackingImport コンポーネントの内容に合わせた適切なサイズにする"

success_metrics:
  - "「伝票番号インポート」ボタンが機能し、クリックでモーダルが開く"
  - "モーダル内でファイルインポートが正常に実行できる"
  - "インポート成功後に配送一覧が自動的に最新状態に更新される"
  - "GitHub issue #38 が解決される"
