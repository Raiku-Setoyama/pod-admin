id: FEAT-0023
summary: 外部販売サイトがAPIを通じて発注中（ordered）の注文を取り消し（cancelled）できる

background:
  why: |
    外部販売サイトで注文がキャンセルされた場合、POD管理システム側でも
    対応する注文を取り消す手段が必要。現在、外部APIには注文作成・ステータス照会
    はあるが、注文取り消しエンドポイントが存在しない。
    このエンドポイントを追加することで、外部サイトとの注文ライフサイクルの
    整合性を保てるようになる。
  who: 外部販売サイト（APIキー認証を持つ外部システム）
  when: |
    - 外部販売サイトでエンドユーザーが注文をキャンセルした場合
    - 外部販売サイト側の運営判断で注文を取り消す場合
    - 注文がまだ発注中（ordered）で、製造開始前に取り消したい場合

scope:
  includes:
    - OrderStatus enum に CANCELLED = "cancelled" を追加（api/app/models/order.py）
    - OrderCancelResponse スキーマを追加（api/app/schemas/external.py）
    - ExternalService に cancel_order メソッドを追加（api/app/services/external_service.py）
    - POST /api/v1/external/orders/{order_number}/cancel エンドポイントを追加（api/app/routers/external.py）
    - ユニットテスト（api/tests/unit/）
    - 統合テスト（api/tests/integration/）
  excludes:
    - OrderItemStatus への CANCELLED 追加（注文レベルのキャンセルのみ）
    - フロントエンド（管理画面）の変更
    - キャンセル済み注文の復元（undo）機能
    - キャンセル理由の記録
    - E2Eテスト（明示的な依頼なし）
  prerequisites:
    - 既存の verify_api_key 依存関係が利用可能であること
    - OrderRepository に find_by_order_number メソッドが存在すること
    - ExternalService が OrderRepository を保持していること（既存）
    - NotFoundError, ValidationError が utils/exceptions.py に存在すること

input_output:
  inputs:
    - name: order_number
      type: string
      required: true
      validation: URLパスパラメータ。既存の注文番号に一致する必要がある
    - name: X-API-Key
      type: string (header)
      required: true
      validation: 有効なAPIキー（verify_api_key で検証）
  outputs:
    - name: OrderCancelResponse
      type: JSON object
      description: |
        正常系レスポンス（200 OK）:
        {
          "order_number": "ORD-001",
          "status": "cancelled",
          "cancelled_at": "2026-02-28T12:00:00+09:00"
        }
    - name: エラーレスポンス（404）
      type: JSON object
      description: 指定された order_number の注文が存在しない場合
    - name: エラーレスポンス（409）
      type: JSON object
      description: 注文ステータスが ordered 以外で取り消し不可の場合
    - name: エラーレスポンス（401）
      type: JSON object
      description: APIキーが無効または未指定の場合
  state_changes:
    - "対象注文の status が 'ordered' から 'cancelled' に変更される"
    - "対象注文の updated_at が更新される"

acceptance_criteria:
  # ユニットテスト - モデル
  - id: AC-001
    description: OrderStatus enum に CANCELLED が存在し、値が "cancelled" である
    test_type: unit
    given: OrderStatus enum が定義されている
    when: OrderStatus.CANCELLED を参照する
    then: 値が "cancelled" である

  # ユニットテスト - スキーマ
  - id: AC-002
    description: OrderCancelResponse スキーマが order_number, status, cancelled_at フィールドを持つ
    test_type: unit
    given: OrderCancelResponse スキーマが定義されている
    when: 有効なデータでインスタンスを生成する
    then: order_number (str), status (OrderStatus), cancelled_at (datetime) が正しく設定される

  # ユニットテスト - サービスロジック（正常系）
  - id: AC-003
    description: ステータスが ordered の注文を正常に cancelled に更新できる
    test_type: unit
    given: ステータスが ordered の注文が存在する
    when: cancel_order メソッドを order_number を指定して呼び出す
    then: 注文のステータスが cancelled に更新され、OrderCancelResponse が返される

  # ユニットテスト - サービスロジック（異常系: 注文不存在）
  - id: AC-004
    description: 存在しない注文番号を指定した場合 NotFoundError が発生する
    test_type: unit
    given: 指定した order_number の注文が存在しない
    when: cancel_order メソッドを呼び出す
    then: NotFoundError が発生する（status_code=404）

  # ユニットテスト - サービスロジック（異常系: ステータス不正）
  - id: AC-005
    description: ステータスが ordered 以外の注文を取り消そうとすると 409 エラーが発生する
    test_type: unit
    given: ステータスが manufacturing の注文が存在する
    when: cancel_order メソッドを呼び出す
    then: status_code=409 の AppException が発生し、「発注中の注文のみ取り消せます」メッセージを含む

  - id: AC-006
    description: ステータスが shipped の注文を取り消そうとすると 409 エラーが発生する
    test_type: unit
    given: ステータスが shipped の注文が存在する
    when: cancel_order メソッドを呼び出す
    then: status_code=409 の AppException が発生し、「発注中の注文のみ取り消せます」メッセージを含む

  - id: AC-007
    description: ステータスが delivered の注文を取り消そうとすると 409 エラーが発生する
    test_type: unit
    given: ステータスが delivered の注文が存在する
    when: cancel_order メソッドを呼び出す
    then: status_code=409 の AppException が発生し、「発注中の注文のみ取り消せます」メッセージを含む

  # 統合テスト - APIエンドポイント（正常系）
  - id: AC-008
    description: POST /api/v1/external/orders/{order_number}/cancel が正常に 200 を返す
    test_type: integration
    given: ステータスが ordered の注文がDBに存在し、有効なAPIキーを使用する
    when: POST /api/v1/external/orders/{order_number}/cancel を呼び出す
    then: 200 OK で OrderCancelResponse が返され、DBの注文ステータスが cancelled に更新されている

  # 統合テスト - APIエンドポイント（異常系: 注文不存在）
  - id: AC-009
    description: 存在しない注文番号で 404 が返される
    test_type: integration
    given: 存在しない order_number を指定し、有効なAPIキーを使用する
    when: POST /api/v1/external/orders/{order_number}/cancel を呼び出す
    then: 404 Not Found エラーが返される

  # 統合テスト - APIエンドポイント（異常系: ステータス不正）
  - id: AC-010
    description: ordered 以外のステータスの注文で 409 が返される
    test_type: integration
    given: ステータスが manufacturing の注文がDBに存在し、有効なAPIキーを使用する
    when: POST /api/v1/external/orders/{order_number}/cancel を呼び出す
    then: 409 Conflict エラーが返される

  # 統合テスト - 認証
  - id: AC-011
    description: APIキーなしで 401 が返される
    test_type: integration
    given: APIキーヘッダーを付与しない
    when: POST /api/v1/external/orders/{order_number}/cancel を呼び出す
    then: 401 Unauthorized エラーが返される

constraints:
  performance:
    - レスポンス時間は500ms以内（DB操作1回のため十分達成可能）
  security:
    - verify_api_key による APIキー認証が必須
    - 認証されていないリクエストには 401 を返す
    - パスパラメータの order_number のみで操作（任意のクエリパラメータによるフィルタなし）
  compatibility:
    - 既存の OrderStatus 値（ordered, manufacturing, delivered, shipped）に影響しない
    - 既存の外部APIエンドポイント（product-options, price-calculation, orders/status）に影響しない
    - 既存の管理画面機能に影響しない

assumptions:
  - 要件では「ValidationError を使用」と記載があるが、409 Conflict を返す必要があるため、status_code=409 のカスタム例外（ConflictError 等）を新規追加するか、AppException を直接使用する想定。architect フェーズで最適な実装方法を決定する
  - cancelled_at は注文の updated_at タイムスタンプを使用する（Order モデルに cancelled_at カラムは追加しない）
  - キャンセル時に OrderItem のステータスは変更しない（注文レベルのキャンセルのみ）
  - 既にキャンセル済み（cancelled）の注文に対して再度キャンセルを実行した場合も 409 を返す（ordered 以外は全て対象外）
  - Alembic マイグレーションは enum がDB上は文字列カラム（String(20)）のため不要（アプリケーション層の enum 追加のみ）
  - cancelled_at フィールドの値として updated_at を使用する（TimestampMixin が自動更新する）

success_metrics:
  - 外部販売サイトが発注中の注文を API 経由で取り消せる
  - 発注中以外の注文の取り消しは適切に拒否される（409）
  - 存在しない注文番号へのリクエストは 404 を返す
  - APIキー認証が正しく動作する
  - 既存の外部API・管理画面機能に影響がない
  - 全テスト（ユニット・統合）がパスする
