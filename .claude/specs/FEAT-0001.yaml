id: FEAT-0001
summary: 管理者向け設定ページから名前変更・パスワード変更のUIを削除し、メールアドレス表示のみを残す

background:
  why: 機能を使わないため不要
  who: 管理者
  when: 設定ページにアクセスした際

scope:
  includes:
    - 「アカウント情報」カードから名前入力フィールドと保存ボタンを削除
    - 「パスワード変更」カード全体を削除
    - 不要になったimport文の削除
  excludes:
    - メールアドレス表示（残す）
    - 設定ページ自体の削除（ページは残す）
    - バックエンドAPIの変更（UIのみ）
  prerequisites:
    - 既存の設定ページが存在すること

input_output:
  inputs: []
  outputs:
    - name: 設定ページ
      type: React Component
      description: メールアドレス表示のみのシンプルな設定ページ
  state_changes: []

acceptance_criteria:
  - id: AC-001
    description: 設定ページにアクセスするとメールアドレスが表示される
    test_type: unit
    given: 設定ページにアクセスした状態
    when: ページがレンダリングされる
    then: メールアドレスが表示される
  - id: AC-002
    description: 名前入力フィールドが存在しない
    test_type: unit
    given: 設定ページにアクセスした状態
    when: ページがレンダリングされる
    then: 名前入力フィールドが存在しない
  - id: AC-003
    description: パスワード変更セクションが存在しない
    test_type: unit
    given: 設定ページにアクセスした状態
    when: ページがレンダリングされる
    then: パスワード変更に関する要素が存在しない
  - id: AC-004
    description: 保存ボタンが存在しない
    test_type: unit
    given: 設定ページにアクセスした状態
    when: ページがレンダリングされる
    then: 保存ボタンが存在しない

constraints:
  performance: []
  security: []
  compatibility: []

assumptions:
  - バックエンドに名前・パスワード変更APIがあっても、今回は削除しない（UI削除のみ）

success_metrics:
  - 設定ページがエラーなく表示される
  - 名前・パスワード変更UIが表示されない
