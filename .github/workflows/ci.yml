name: ci

# プロジェクトの静的解析（ビルド・テストゲート）。
# REQ-0041 で全件を緑化したため、ruff / mypy / eslint / tsc はすべてブロッキングで実行する。
# マージ後にブランチ保護の必須チェックへ昇格させること。
# テスト（pytest / vitest / Playwright）は DB・インフラ準備後に追加する。
# infra/ の Terraform は fmt と validate だけを見る（apply は CI では行わない）。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 依存インストール
        working-directory: api
        run: uv sync --extra dev
      - name: ruff
        working-directory: api
        run: uv run ruff check .
      - name: mypy
        working-directory: api
        run: uv run mypy .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 依存インストール
        working-directory: web
        run: npm ci
      - name: eslint
        working-directory: web
        run: npm run lint
      - name: tsc
        working-directory: web
        run: npx tsc --noEmit

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false
      - name: fmt / validate
        run: bash scripts/terraform-check.sh
