[project]
name = "pod-admin-api"
version = "0.1.0"
description = "POD Goods Order Management System - Backend API"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1.0", # passlib互換性のためバージョン固定
    # File Processing
    "openpyxl>=3.1.0",
    "chardet>=5.0.0",
    "python-multipart>=0.0.17",
    # Utilities
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    # PDF Generation
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    # Email
    "sendgrid>=6.11.0",
    # Japanese holidays
    "jpholiday>=0.1.9",
    # Cloud Storage (本番=Railway でのファイル永続化。未設定なら未使用)
    "google-cloud-storage>=2.18.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # Code Quality
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Type Stubs
    "types-passlib>=1.7.0",
    "types-aiofiles>=25.1.0",
    "types-pyyaml>=6.0.12",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # Code Quality
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Type Stubs
    "types-passlib>=1.7.0",
    "types-aiofiles>=25.1.0",
    "types-pyyaml>=6.0.12",
    # HTTP client for testing
    "httpx>=0.28.0",
    "pypdf>=6.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI は引数のデフォルト値に Depends() / Query() などを置く設計であり、
# B008（引数デフォルトでの関数呼び出し）はこの用法に対しては偽陽性になる。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
